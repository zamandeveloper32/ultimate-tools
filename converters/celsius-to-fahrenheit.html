<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celsius to Fahrenheit Converter</title>
    <meta name="description" content="Convert Celsius to Fahrenheit quickly and accurately with our free temperature converter.">

    <link rel="stylesheet" href="../css/style.css?v=3">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="../index.html" class="logo">Ultimate Tools</a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#calculators">Calculators</a>
            <a href="../index.html#converters">Converters</a>
        </nav>
    </div>
</header>

<main class="tool-page">
    <div class="container">

        <div class="tool-header">
            <h1>Celsius to Fahrenheit Converter</h1>
            <p>Convert Celsius (°C) to Fahrenheit (°F) quickly and accurately.</p>
        </div>

        <div class="converter-card">

            <label for="converterInput">Celsius (°C)</label>

            <input
                type="number"
                id="converterInput"
                placeholder="Enter Celsius"
                step="any"
            >

            <button id="convertButton">Convert</button>

            <div class="result-box">
                <span>Result</span>
                <strong id="result">0 °F</strong>
            </div>

        </div>

        <div class="related-tools">
            <h2>Related Converters</h2>

            <a href="fahrenheit-to-celsius.html">
                Fahrenheit to Celsius
            </a>

            <a href="cm-to-m.html">
                Centimeters to Meters
            </a>

            <a href="kg-to-lbs.html">
                Kilograms to Pounds
            </a>
        </div>

    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Ultimate Tools. All rights reserved.</p>
    </div>
</footer>

<script>
window.converterConfig = {
    from: "°C",
    to: "°F",
    convert: function(value) {
        return (value * 9 / 5) + 32;
    }
};
</script>

<script src="../js/converter.js?v=4"></script>

</body>
</html>
