<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fahrenheit to Celsius Converter</title>
    <meta name="description" content="Convert Fahrenheit to Celsius quickly and accurately with our free temperature converter.">

    <link rel="stylesheet" href="../css/style.css?v=3">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="../index.html" class="logo">Ultimate Tools</a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#calculators">Calculators</a>
            <a href="../index.html#converters">Converters</a>
        </nav>
    </div>
</header>

<main class="tool-page">
    <div class="container">

        <div class="tool-header">
            <h1>Fahrenheit to Celsius Converter</h1>
            <p>Convert Fahrenheit (°F) to Celsius (°C) quickly and accurately.</p>
        </div>

        <div class="converter-card">

            <label for="converterInput">Fahrenheit (°F)</label>

            <input
                type="number"
                id="converterInput"
                placeholder="Enter Fahrenheit"
                step="any"
            >

            <button id="convertButton">Convert</button>

            <div class="result-box">
                <span>Result</span>
                <strong id="result">0 °C</strong>
            </div>

        </div>

        <div class="related-tools">
            <h2>Related Converters</h2>

            <a href="celsius-to-fahrenheit.html">
                Celsius to Fahrenheit
            </a>

            <a href="cm-to-m.html">
                Centimeters to Meters
            </a>

            <a href="kg-to-lbs.html">
                Kilograms to Pounds
            </a>
        </div>

    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Ultimate Tools. All rights reserved.</p>
    </div>
</footer>

<script>
window.converterConfig = {
    from: "°F",
    to: "°C",
    convert: function(value) {
        return (value - 32) * 5 / 9;
    }
};
</script>

<script src="../js/converter.js?v=4"></script>

</body>
</html>
