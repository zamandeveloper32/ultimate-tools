<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Generator - Generate Secure Passwords</title>

    <meta name="description"
          content="Generate strong random passwords online with customizable length and character options.">

    <link rel="stylesheet" href="../css/style.css?v=6">

</head>

<body>

<header>

    <div class="container">

        <div class="logo">
            <a href="../index.html">Ultimate Tools</a>
        </div>

        <nav>
            <a href="../index.html#calculators">Calculators</a>
            <a href="../index.html#converters">Converters</a>
            <a href="../all-tools.html">All Tools</a>
        </nav>

    </div>

</header>


<main class="tool-page">

    <div class="container">

        <div class="tool-header">

            <h1>Password Generator</h1>

            <p>
                Generate a strong random password with your preferred options.
            </p>

        </div>


        <div class="converter-card">

            <label for="lengthInput">
                Password Length
            </label>

            <input
                type="number"
                id="lengthInput"
                value="16"
                min="4"
                max="64"
            >


            <label>
                <input
                    type="checkbox"
                    id="uppercaseInput"
                    checked
                >
                Include Uppercase Letters
            </label>


            <label>
                <input
                    type="checkbox"
                    id="lowercaseInput"
                    checked
                >
                Include Lowercase Letters
            </label>


            <label>
                <input
                    type="checkbox"
                    id="numbersInput"
                    checked
                >
                Include Numbers
            </label>


            <label>
                <input
                    type="checkbox"
                    id="symbolsInput"
                    checked
                >
                Include Symbols
            </label>


            <button id="generateButton">
                Generate Password
            </button>


            <div class="result-box">

                <span>Generated Password</span>

                <strong
                    id="result"
                    style="word-break: break-all;"
                >
                    Click Generate
                </strong>

            </div>

        </div>


        <div class="related-tools">

            <h2>Related Tools</h2>

            <a href="word-counter.html">
                Word Counter
            </a>

            <a href="../all-tools.html">
                Browse All Tools
            </a>

        </div>

    </div>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 Ultimate Tools. All rights reserved.
        </p>

    </div>

</footer>


<script>

const lengthInput =
    document.getElementById("lengthInput");

const uppercaseInput =
    document.getElementById("uppercaseInput");

const lowercaseInput =
    document.getElementById("lowercaseInput");

const numbersInput =
    document.getElementById("numbersInput");

const symbolsInput =
    document.getElementById("symbolsInput");

const generateButton =
    document.getElementById("generateButton");

const result =
    document.getElementById("result");


function generatePassword() {

    const length =
        parseInt(lengthInput.value);


    let characters = "";


    if (uppercaseInput.checked) {
        characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if (lowercaseInput.checked) {
        characters += "abcdefghijklmnopqrstuvwxyz";
    }

    if (numbersInput.checked) {
        characters += "0123456789";
    }

    if (symbolsInput.checked) {
        characters += "!@#$%^&*()-_=+[]{}?";
    }


    if (!characters) {

        result.textContent =
            "Select at least one option";

        return;

    }


    if (
        isNaN(length) ||
        length < 4 ||
        length > 64
    ) {

        result.textContent =
            "Length must be between 4 and 64";

        return;

    }


    let password = "";


    const randomValues =
        new Uint32Array(length);

    crypto.getRandomValues(randomValues);


    for (let i = 0; i < length; i++) {

        password +=
            characters[
                randomValues[i] % characters.length
            ];

    }


    result.textContent =
        password;

}


generateButton.addEventListener(
    "click",
    generatePassword
);

</script>

</body>

</html>
