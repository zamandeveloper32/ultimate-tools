<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VAT Calculator - Calculate VAT and Total Price</title>

    <meta name="description"
          content="Free VAT calculator to calculate VAT amount, price including VAT and price excluding VAT.">

    <link rel="stylesheet" href="../css/style.css?v=7">
</head>

<body>

<header>
    <div class="container">

        <div class="logo">
            <a href="../index.html">Ultimate Tools</a>
        </div>

        <nav>
            <a href="../index.html#calculators">Calculators</a>
            <a href="../index.html#converters">Converters</a>
            <a href="../all-tools.html">All Tools</a>
        </nav>

    </div>
</header>


<main class="tool-page">

    <div class="container">

        <div class="tool-header">

            <h1>VAT Calculator</h1>

            <p>
                Calculate VAT amount and the final price including VAT.
            </p>

        </div>


        <div class="converter-card">

            <label for="priceInput">
                Price Before VAT
            </label>

            <input
                type="number"
                id="priceInput"
                placeholder="Enter price"
                min="0"
                step="any"
            >


            <label for="vatInput">
                VAT Rate (%)
            </label>

            <input
                type="number"
                id="vatInput"
                placeholder="Enter VAT rate"
                min="0"
                step="any"
            >


            <button id="calculateButton">
                Calculate VAT
            </button>


            <div class="result-box">

                <span>VAT Amount</span>

                <strong id="vatResult">
                    —
                </strong>

            </div>


            <div class="result-box">

                <span>Price Including VAT</span>

                <strong id="totalResult">
                    —
                </strong>

            </div>

        </div>

    </div>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 Ultimate Tools. All rights reserved.
        </p>

    </div>
</footer>


<script>

const priceInput =
    document.getElementById("priceInput");

const vatInput =
    document.getElementById("vatInput");

const calculateButton =
    document.getElementById("calculateButton");

const vatResult =
    document.getElementById("vatResult");

const totalResult =
    document.getElementById("totalResult");


function calculateVAT() {

    const price =
        parseFloat(priceInput.value);

    const vatRate =
        parseFloat(vatInput.value);


    if (
        isNaN(price) ||
        isNaN(vatRate) ||
        price < 0 ||
        vatRate < 0
    ) {

        vatResult.textContent =
            "Enter valid values";

        totalResult.textContent =
            "—";

        return;

    }


    const vat =
        price * (vatRate / 100);

    const total =
        price + vat;


    vatResult.textContent =
        vat.toFixed(2);

    totalResult.textContent =
        total.toFixed(2);

}


calculateButton.addEventListener(
    "click",
    calculateVAT
);

</script>

</body>

</html>
