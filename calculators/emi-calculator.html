<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator - Calculate Monthly Loan Payment</title>
    <meta name="description" content="Calculate your monthly EMI, total loan payment, and total interest with our free EMI Calculator.">

    <link rel="stylesheet" href="../css/style.css?v=7">
</head>

<body>

<header class="site-header">
    <div class="container">
        <div class="logo">
            <a href="../index.html">Ultimate Tools</a>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../all-tools.html">All Tools</a>
        </nav>
    </div>
</header>

<main class="container">

    <div class="tool-header">
        <h1>EMI Calculator</h1>
        <p>Calculate your monthly loan payment, total interest, and total repayment.</p>
    </div>

    <div class="calculator-card">

        <label for="loanAmount">Loan Amount</label>
        <input type="number" id="loanAmount" placeholder="e.g. 100000" min="0">

        <label for="interestRate">Annual Interest Rate (%)</label>
        <input type="number" id="interestRate" placeholder="e.g. 8.5" min="0" step="0.01">

        <label for="loanTerm">Loan Term (Years)</label>
        <input type="number" id="loanTerm" placeholder="e.g. 5" min="1" step="1">

        <button onclick="calculateEMI()">Calculate EMI</button>

        <div class="result-box">

            <div>
                <span>Monthly EMI</span>
                <strong id="monthlyEMI">—</strong>
            </div>

            <div>
                <span>Total Interest</span>
                <strong id="totalInterest">—</strong>
            </div>

            <div>
                <span>Total Payment</span>
                <strong id="totalPayment">—</strong>
            </div>

        </div>

    </div>

</main>

<script>
function calculateEMI() {

    const principal = parseFloat(document.getElementById("loanAmount").value);
    const annualRate = parseFloat(document.getElementById("interestRate").value);
    const years = parseFloat(document.getElementById("loanTerm").value);

    if (
        isNaN(principal) ||
        isNaN(annualRate) ||
        isNaN(years) ||
        principal <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {
        document.getElementById("monthlyEMI").textContent = "Enter valid values";
        document.getElementById("totalInterest").textContent = "—";
        document.getElementById("totalPayment").textContent = "—";
        return;
    }

    const monthlyRate = annualRate / 100 / 12;
    const numberOfPayments = years * 12;

    let emi;

    if (monthlyRate === 0) {
        emi = principal / numberOfPayments;
    } else {
        emi =
            principal *
            monthlyRate *
            Math.pow(1 + monthlyRate, numberOfPayments) /
            (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
    }

    const totalPayment = emi * numberOfPayments;
    const totalInterest = totalPayment - principal;

    document.getElementById("monthlyEMI").textContent =
        formatCurrency(emi);

    document.getElementById("totalInterest").textContent =
        formatCurrency(totalInterest);

    document.getElementById("totalPayment").textContent =
        formatCurrency(totalPayment);
}

function formatCurrency(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}
</script>

</body>
</html>
