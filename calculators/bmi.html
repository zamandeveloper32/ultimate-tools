<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator - Calculate Body Mass Index</title>
    <meta name="description" content="Calculate your Body Mass Index (BMI) using height and weight with this free online BMI calculator.">

    <link rel="stylesheet" href="../css/style.css?v=3">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="../index.html" class="logo">Ultimate Tools</a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#calculators">Calculators</a>
            <a href="../index.html#converters">Converters</a>
        </nav>
    </div>
</header>

<main class="tool-page">
    <div class="container">

        <div class="tool-header">
            <h1>BMI Calculator</h1>
            <p>Calculate your Body Mass Index using your height and weight.</p>
        </div>

        <div class="converter-card">

            <label for="weightInput">Weight (kg)</label>

            <input
                type="number"
                id="weightInput"
                placeholder="Enter weight"
                step="any"
                min="0"
            >

            <label for="heightInput">Height (cm)</label>

            <input
                type="number"
                id="heightInput"
                placeholder="Enter height"
                step="any"
                min="0"
            >

            <button id="calculateButton">Calculate BMI</button>

            <div class="result-box">
                <span>Your BMI</span>
                <strong id="result">Enter your values</strong>
            </div>

            <div id="category" class="bmi-category"></div>

        </div>

        <div class="related-tools">
            <h2>Related Tools</h2>

            <a href="age.html">
                Age Calculator
            </a>

            <a href="percentage.html">
                Percentage Calculator
            </a>

            <a href="../converters/kg-to-lbs.html">
                Kilograms to Pounds
            </a>
        </div>

    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Ultimate Tools. All rights reserved.</p>
    </div>
</footer>

<script>
const weightInput = document.getElementById("weightInput");
const heightInput = document.getElementById("heightInput");
const calculateButton = document.getElementById("calculateButton");
const result = document.getElementById("result");
const category = document.getElementById("category");

function calculateBMI() {

    const weight = parseFloat(weightInput.value);
    const heightCm = parseFloat(heightInput.value);

    if (
        isNaN(weight) ||
        isNaN(heightCm) ||
        weight <= 0 ||
        heightCm <= 0
    ) {
        result.textContent = "Enter valid values";
        category.textContent = "";
        return;
    }

    const heightMeters = heightCm / 100;

    const bmi = weight / (heightMeters * heightMeters);

    result.textContent = bmi.toFixed(1);

    if (bmi < 18.5) {
        category.textContent = "Underweight";
    } else if (bmi < 25) {
        category.textContent = "Normal weight";
    } else if (bmi < 30) {
        category.textContent = "Overweight";
    } else {
        category.textContent = "Obesity";
    }
}

calculateButton.addEventListener("click", calculateBMI);

weightInput.addEventListener("input", calculateBMI);
heightInput.addEventListener("input", calculateBMI);

weightInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        calculateBMI();
    }
});

heightInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        calculateBMI();
    }
});
</script>

</body>
</html>
